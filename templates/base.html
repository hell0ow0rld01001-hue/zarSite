<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}گروه صنعتی زر{% endblock %}</title>

  <!-- Vazirmatn Font + Bootstrap 5 RTL (for the articles app) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">

  {% block extra_head %}{% endblock %}

  <style>
.zar-typing {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 2px;
}

.zar-typing span {
  width: 6px;
  height: 6px;
  background-color: #71717a;
  border-radius: 50%;
  animation: zarBounce 1.2s infinite ease-in-out both;
}

.zar-typing span:nth-child(1) { animation-delay: -0.32s; }
.zar-typing span:nth-child(2) { animation-delay: -0.16s; }

@keyframes zarBounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

    @keyframes zarSpin {
      to { transform: rotate(360deg); }
    }
    body {
      margin: 0;
      font-family: "Vazirmatn", Tahoma, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* === Minimalist Zar AI Support Widget === */
    #zar-chat-widget {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 999999;
      font-family: "Vazirmatn", Tahoma, sans-serif;
    }

    #zar-chat-toggle {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #18181b;
      color: #f59e0b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #zar-chat-toggle:hover {
      transform: translateY(-3px);
      background: #27272a;
      box-shadow: 0 14px 30px -5px rgba(0, 0, 0, 0.3);
    }

    #zar-chat-box {
      position: absolute;
      bottom: 72px;
      right: 0;
      width: 350px;
      height: 470px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e4e4e7;
      transform-origin: bottom right;
      animation: zarPop 0.18s ease-out;
    }

    @keyframes zarPop {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .zar-hidden {
      display: none !important;
    }

    #zar-chat-header {
      background: #18181b;
      color: #fafafa;
      padding: 14px 18px;
      font-weight: 600;
      font-size: 13.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .zar-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .zar-dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      box-shadow: 0 0 8px #f59e0b;
    }

    #zar-chat-close {
      background: none;
      border: none;
      color: #a1a1aa;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.15s;
    }

    #zar-chat-close:hover {
      color: #ffffff;
    }

    #zar-chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .zar-msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      word-wrap: break-word;
    }

    .zar-user {
      align-self: flex-start;
      background: #18181b;
      color: #fafafa;
      border-bottom-right-radius: 3px;
    }

    .zar-bot {
      align-self: flex-end;
      background: #ffffff;
      color: #27272a;
      border: 1px solid #e4e4e7;
      border-bottom-left-radius: 3px;
    }

    #zar-chat-form {
      display: flex;
      border-top: 1px solid #f4f4f5;
      background: white;
      padding: 10px;
      gap: 8px;
    }

    #zar-chat-input {
      flex: 1;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    #zar-chat-input:focus {
      border-color: #18181b;
    }

    #zar-chat-send {
      background: #f59e0b;
      color: #18181b;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #zar-chat-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <!-- === Zar Group AI Support Widget === -->
  <div id="zar-chat-widget" dir="rtl">
    <button id="zar-chat-toggle" type="button" aria-label="پشتیبانی آنلاین">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>

    <div id="zar-chat-box" class="zar-hidden">
      <div id="zar-chat-header">
        <div class="zar-header-title">
          <span class="zar-dot"></span>
          <span>پشتیبانی هوشمند گروه زر</span>
        </div>
        <button id="zar-chat-close" type="button">&times;</button>
      </div>

      <div id="zar-chat-messages">
        <div class="zar-msg zar-bot">
          سلام! چطور می‌توانم در مورد محصولات گروه زر به شما کمک کنم؟
        </div>
      </div>

      <form id="zar-chat-form">
        <input
          type="text"
          id="zar-chat-input"
          placeholder="پیام خود را بنویسید..."
          autocomplete="off"
          required
        />
        <button type="submit" id="zar-chat-send">ارسال</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const toggleBtn = document.getElementById("zar-chat-toggle");
      const closeBtn = document.getElementById("zar-chat-close");
      const chatBox = document.getElementById("zar-chat-box");
      const chatForm = document.getElementById("zar-chat-form");
      const chatInput = document.getElementById("zar-chat-input");
      const chatSend = document.getElementById("zar-chat-send");
      const messagesContainer = document.getElementById("zar-chat-messages");

      const savedChat = JSON.parse(sessionStorage.getItem("zar_ui_chat") || "[]");
      savedChat.forEach((m) => appendMessageToDOM(m.text, m.sender));

      toggleBtn.addEventListener("click", () => {
        chatBox.classList.toggle("zar-hidden");
        if (!chatBox.classList.contains("zar-hidden")) chatInput.focus();
      });

      closeBtn.addEventListener("click", () => chatBox.classList.add("zar-hidden"));

      function appendMessageToDOM(text, sender) {
        const div = document.createElement("div");
        div.className = `zar-msg ${sender === "user" ? "zar-user" : "zar-bot"}`;
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return div;
      }

      function saveMessageToStorage(text, sender) {
        savedChat.push({ text, sender });
        sessionStorage.setItem("zar_ui_chat", JSON.stringify(savedChat.slice(-20)));
      }

      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (!message) return;

        appendMessageToDOM(message, "user");
        saveMessageToStorage(message, "user");
        chatInput.value = "";
        chatSend.disabled = true;

        const loadingDiv = document.createElement("div");
        loadingDiv.className = "zar-msg zar-bot";
        loadingDiv.innerHTML = '<div class="zar-typing"><span></span><span></span><span></span></div>';
        messagesContainer.appendChild(loadingDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
          const response = await fetch("{% url 'chat_api' %}", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": "{{ csrf_token }}",
            },
            body: JSON.stringify({ message }),
          });

          const data = await response.json();
          loadingDiv.remove();

          if (response.ok && data.reply) {
            appendMessageToDOM(data.reply, "bot");
            saveMessageToStorage(data.reply, "bot");
          } else {
            appendMessageToDOM(data.error || "خطا در دریافت پاسخ.", "bot");
          }
        } catch (err) {
          loadingDiv.remove();
          appendMessageToDOM("عدم ارتباط با سرور.", "bot");
        } finally {
          chatSend.disabled = false;
          chatInput.focus();
        }
      });
    })();
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
